<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);

/*BJ-DECRYPT-BEGIN*/
const bjB64=s=>{const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};
async function bjCt(b64){
 try{const r=await fetch('data:application/octet-stream;base64,'+b64);return new Uint8Array(await r.arrayBuffer())}
 catch{return bjB64(b64)}

async function bjDecrypt(pw,H,ctB64){

 const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:H.iter,hash:'SHA-256'},master,256);

 const ct=await bjCt(ctB64);

 const pt=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv,additionalData:te.encode('bojack-secures:share:v1')},key,ct));

const bjHex=async u=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',u))].map(b=>b.toString(16).padStart(2,'0')).join('');
/*BJ-DECRYPT-END*/

const fmtSize=n=>n>=1e6?(n/1e6).toFixed(1)+' MB':n>=1e3?Math.round(n/1e3)+' KB':n+' bytes';
const fmtDate=t=>{try{return t?new Date(t).toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'}):''}catch{return''}};
const safeName=n=>String(n||'file').replace(/[\\/:*?"<>|\u0000-\u001f]/g,'_').slice(0,150)||'file';
let urls=[],blobUrl=null,fails=0,timer=null,cur=null;

function row(dl,k,v,cls){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=k;dd.textContent=v;if(cls)dd.className=cls;dl.append(dt,dd)}
function clearOpen(){urls.splice(0).forEach(u=>URL.revokeObjectURL(u));blobUrl=null;cur=null;$('#prev').replaceChildren();$('#info').replaceChildren();$('#note').textContent='';$('#note').hidden=true;$('#fname').textContent=''}
function lockAgain(){clearOpen();$('#openBox').hidden=true;$('#lockBox').hidden=false;$('#pw').value='';$('#msg').textContent='';$('#pw').focus()}

async function show(res){
 const m=res.meta,file=res.file;cur={m,file};
 $('#fname').textContent=m.name||'file';
 const dl=$('#info');
 row(dl,'Type',m.mime||'unknown');row(dl,'Size',fmtSize(file.length)+' ('+file.length.toLocaleString()+' bytes)');
 if(m.mod)row(dl,'Modified',fmtDate(m.mod));if(m.shared)row(dl,'Shared',fmtDate(m.shared));

  const tag=mime.startsWith('image/')?'img':mime.startsWith('video/')?'video':'audio',e=document.createElement(tag);
  e.src=u;if(tag!=='img'){e.controls=true;e.playsInline=true}prev.append(e)}
 else if(/^text\//i.test(mime)&&!/html/i.test(mime)&&file.length<=2e6){const pre=document.createElement('pre');pre.textContent=new TextDecoder().decode(file).slice(0,20000);prev.append(pre)}
 $('#lockBox').hidden=true;$('#openBox').hidden=false;
}

function cool(sec){const b=$('#go');b.disabled=true;let s=sec;
 const tick=()=>{if(s<=0){b.disabled=false;b.textContent='Unlock';$('#msg').textContent='';return}b.textContent='Try again in '+s+'s';s--;timer=setTimeout(tick,1000)};tick()}

async function unlock(){
 const pw=$('#pw').value;if(!pw){$('#msg').textContent='Enter the password.';return}
 const b=$('#go');b.disabled=true;b.textContent='Unlocking…';$('#msg').textContent='';
 try{
  const res=await bjDecrypt(pw,JSON.parse($('#bjh').textContent),$('#bjc').textContent.trim());
  fails=0;$('#pw').value='';b.disabled=false;b.textContent='Unlock';await show(res);
 }catch(err){
  if(err&&err.name==='OperationError'){fails++;$('#msg').textContent='Wrong password, or the file was damaged.';cool(Math.min(30,Math.pow(2,fails-1)))}
  else{b.disabled=false;b.textContent='Unlock';$('#msg').textContent=(err&&err.message)||'Could not open this file.'}
 }
}

$('#go').onclick=unlock;$('#pw').onkeydown=e=>{if(e.key==='Enter')unlock()};
$('#show').onclick=()=>{const p=$('#pw'),on=p.type==='password';p.type=on?'text':'password';$('#show').textContent=on?'Hide password':'Show password'};
$('#relock').onclick=lockAgain;
$('#dl').onclick=()=>{if(!cur)return;
 const mime=String(cur.m.mime||'');
 const u=URL.createObjectURL(new Blob([cur.file],{type:'application/octet-stream'}));urls.push(u);
