stages:
  - build

build_apk:
  stage: build
  image: mingc/android-build-box:latest
  script:
    - npm install
    - npx cap add android
    - bash scripts/patch-android.sh
    - cd android && chmod +x gradlew && ./gradlew assembleDebug
  artifacts:
    paths:
      - android/app/build/outputs/apk/debug/app-debug.apk
