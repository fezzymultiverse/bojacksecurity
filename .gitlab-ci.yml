# V0.6.35: signed RELEASE build. The old job ran assembleDebug, and every debug build is signed with a throw-away "Android Debug"
# key from the runner, so a new APK could never be installed over the one on the phone (signature mismatch).
# Needs these GitLab CI/CD variables (Settings > CI/CD > Variables): KEYSTORE_B64, KEYSTORE_PASS, KEY_ALIAS.
stages:
  - build

build_apk:
  stage: build
  image: mingc/android-build-box:latest
  script:
    - |
      if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASS" ] || [ -z "$KEY_ALIAS" ]; then
        echo "Missing CI variable: KEYSTORE_B64, KEYSTORE_PASS and KEY_ALIAS must all be set."
        echo "Refusing to build an APK that is not signed with your own key (it could not update the installed app)."
        exit 1
      fi
    - bash build.sh ci-prepare
    - bash scripts/verify-build.sh project
    - cd android && chmod +x gradlew && ./gradlew assembleRelease
    - |
      BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
      UNSIGNED=$(ls app/build/outputs/apk/release/*-unsigned.apk | head -1)
      KS="${TMPDIR:-/tmp}/release.keystore"
      echo "$KEYSTORE_B64" | base64 -d > "$KS"
      "$BT/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
      "$BT/apksigner" sign --ks "$KS" --ks-pass env:KEYSTORE_PASS --ks-key-alias "$KEY_ALIAS" --out BojackSecures-signed.apk aligned.apk
      rm -f "$KS"
      "$BT/apksigner" verify --verbose --print-certs BojackSecures-signed.apk | grep -E "Verifies|Verified using|certificate SHA-256" || true
    - cd .. && bash scripts/verify-build.sh apk android/BojackSecures-signed.apk
  artifacts:
    paths:
      - android/BojackSecures-signed.apk
