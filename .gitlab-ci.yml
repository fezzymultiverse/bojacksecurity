stages:
  - build

build_apk:
  stage: build
  image: mingc/android-build-box:latest
  script:
    - npm install
    - npx cap add android
    - cp scripts/android-native/*.java android/app/src/main/java/com/fezzy/vault/
    - sed -i 's/import com.getcapacitor.BridgeActivity;/import com.getcapacitor.BridgeActivity;\nimport com.fezzy.vault.BojackStore;\nimport com.fezzy.vault.PrivBrowser;\nimport com.fezzy.vault.BojackStoreJs;/' android/app/src/main/java/com/fezzy/vault/MainActivity.java
    - cd android && chmod +x gradlew && ./gradlew assembleDebug
  artifacts:
    paths:
      - android/app/build/outputs/apk/debug/app-debug.apk
